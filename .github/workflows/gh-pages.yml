name: Publish

on:
  push:
    branches: [ main ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: jdx/mise-action@v2

      - name: Validate homepage query against parsed graph
        run: |
          npm ci --no-audit --no-fund
          mise run site:query:check

      - name: Scan published source for secrets and local paths
        run: |
          npm install --prefix "$RUNNER_TEMP/secretlint" --no-audit --no-fund secretlint@13.0.6 @secretlint/secretlint-rule-preset-recommend@13.0.6 @secretlint/secretlint-rule-pattern@13.0.6
          "$RUNNER_TEMP/secretlint/node_modules/.bin/secretlint" --secretlintrc .secretlintrc.json --maskSecrets "**/*"

      - uses: astral-sh/setup-uv@v6

      - name: Check podcast RSS
        run: uv run --no-project python scripts/build_rss.py --check

      - name: Test publication preparation
        run: uv run --no-project python -m unittest discover -s tests

      - name: Test episode player lifecycle
        run: node --test tests/*.test.js

      - name: Install Rust for Logseq Gardener
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Build pinned Logseq Gardener
        env:
          GARDENER_REV: cc19e231567ec727daa3921fc17ed6aa7e966609
        run: cargo +1.97.0 install --git https://github.com/codekiln/logseq-gardener --rev "$GARDENER_REV" --locked --root "$RUNNER_TEMP/gardener" logseq-gardener

      - name: Publish with Logseq Gardener
        run: uv run --no-project python scripts/build_site.py --renderer "$RUNNER_TEMP/gardener/bin/lsg" --output www

      - name: Save website preview
        uses: actions/upload-artifact@v4
        with:
          name: gitpa-website
          path: www

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: www
          clean: true
          clean-exclude: |
            .nojekyll
