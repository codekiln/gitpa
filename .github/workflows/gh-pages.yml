name: Publish

on:
  push:
    branches: [ main ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: jdx/mise-action@v2

      - name: Validate homepage query against parsed graph
        run: |
          npm ci --no-audit --no-fund
          mise run site:query:check

      - name: Scan published source for secrets and local paths
        run: |
          npm install --prefix "$RUNNER_TEMP/secretlint" --no-audit --no-fund secretlint@13.0.6 @secretlint/secretlint-rule-preset-recommend@13.0.6 @secretlint/secretlint-rule-pattern@13.0.6
          "$RUNNER_TEMP/secretlint/node_modules/.bin/secretlint" --secretlintrc .secretlintrc.json --maskSecrets "**/*"

      - uses: astral-sh/setup-uv@v6

      - name: Check podcast RSS
        run: uv run --no-project python scripts/build_rss.py --check

      - name: Prepare episode and asset visibility
        run: uv run --no-project python scripts/prepare_site.py --output "$RUNNER_TEMP/gitp-site"

      - name: Logseq Publish
        uses: logseq/publish-spa@main
        with:
          graph-directory: ${{ runner.temp }}/gitp-site
          output-directory: www
          accent-color: indigo

      - name: Save website preview
        uses: actions/upload-artifact@v4
        with:
          name: gitpa-website
          path: www

      - name: Add .nojekyll file
        run: touch www/.nojekyll

      - name: Publish podcast RSS
        run: cp rss.xml www/rss.xml

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: www
          clean: true
          clean-exclude: |
            .nojekyll
