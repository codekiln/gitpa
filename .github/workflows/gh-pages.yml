name: Publish

on:
  push:
    branches: [ main ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: jdx/mise-action@v2

      - name: Validate homepage query against parsed graph
        run: |
          npm ci --no-audit --no-fund
          mise run site:query:check

      - name: Scan published source for secrets and local paths
        run: |
          npm install --prefix "$RUNNER_TEMP/secretlint" --no-audit --no-fund secretlint@13.0.6 @secretlint/secretlint-rule-preset-recommend@13.0.6 @secretlint/secretlint-rule-pattern@13.0.6
          "$RUNNER_TEMP/secretlint/node_modules/.bin/secretlint" --secretlintrc .secretlintrc.json --maskSecrets "**/*"

      - uses: astral-sh/setup-uv@v6

      - name: Check podcast RSS
        run: uv run --no-project python scripts/build_rss.py --check

      - name: Test publication preparation
        run: uv run --no-project python -m unittest discover -s tests

      - name: Test episode player lifecycle
        run: node --test tests/*.test.js

      - name: Install Rust for Logseq Gardener
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Build pinned Logseq Gardener
        env:
          GARDENER_REV: ebf54528c0c43ad82f8fb52ed9e988558dc817af
        run: cargo +1.97.0 install --git https://github.com/codekiln/logseq-gardener --rev "$GARDENER_REV" --locked --root "$RUNNER_TEMP/gardener" logseq-gardener

      - name: Publish with Logseq Gardener
        run: uv run --no-project python scripts/build_site.py --renderer "$RUNNER_TEMP/gardener/bin/lsg" --search --output www

      - name: Save website preview
        uses: actions/upload-artifact@v4
        with:
          name: gitpa-website
          path: www

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    concurrency:
      group: production-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gitpa-website
          path: www
      - name: Check production revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_pages.py prepare
      - name: Publish gh-pages
        if: steps.revision.outputs.current == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: www
          clean: true
          clean-exclude: |
            .nojekyll
      - name: Build Pages and verify the live revision
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_pages.py verify
