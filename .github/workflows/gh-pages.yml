name: Publish

on:
  push:
    branches: [ main ]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: jdx/mise-action@v2
        env:
          # The next steps download a pinned, checksum-verified lsg. Without this, mise would also install a second lsg that CI never runs, and fail while every release is under mise's one-day minimum release age.
          MISE_DISABLE_TOOLS: github:codekiln/logseq-gardener

      - name: Install homepage query dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan published source for secrets and local paths
        run: |
          npm install --prefix "$RUNNER_TEMP/secretlint" --no-audit --no-fund secretlint@13.0.6 @secretlint/secretlint-rule-preset-recommend@13.0.6 @secretlint/secretlint-rule-pattern@13.0.6
          "$RUNNER_TEMP/secretlint/node_modules/.bin/secretlint" --secretlintrc .secretlintrc.json --maskSecrets "**/*"

      - uses: astral-sh/setup-uv@v6

      - name: Check podcast RSS
        run: uv run --no-project python scripts/build_rss.py --check

      - name: Test publication preparation
        run: uv run --no-project python -m unittest discover -s tests

      - name: Test episode player lifecycle
        run: node --test tests/*.test.js

      # To upgrade, set GARDENER_VERSION to a newer release tag and GARDENER_SHA256
      # to the hash in that release's logseq-gardener-x86_64-unknown-linux-gnu.tar.xz.sha256.
      # Agents install each new release without asking codekiln first.
      - name: Install released Logseq Gardener
        env:
          GARDENER_VERSION: v0.0.6
          GARDENER_SHA256: 5a459ef49c4424f4f3281278b436c888797d9218cf108230476d8a023511b4a3
          GARDENER_TARGET: x86_64-unknown-linux-gnu
        run: |
          archive="logseq-gardener-$GARDENER_TARGET.tar.xz"
          download="$RUNNER_TEMP/gardener-download"
          mkdir -p "$download" "$RUNNER_TEMP/gardener/bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$download/$archive" \
            "https://github.com/codekiln/logseq-gardener/releases/download/$GARDENER_VERSION/$archive"
          echo "$GARDENER_SHA256  $download/$archive" | sha256sum --check --strict
          tar -xJf "$download/$archive" -C "$download"
          install -m 0755 "$download/logseq-gardener-$GARDENER_TARGET/lsg" "$RUNNER_TEMP/gardener/bin/lsg"
          "$RUNNER_TEMP/gardener/bin/lsg" --version

      - name: Publish with Logseq Gardener
        run: uv run --no-project python scripts/build_site.py --renderer "$RUNNER_TEMP/gardener/bin/lsg" --search --output www

      # Page titles can contain characters that artifact paths reject, such as ? and ".
      - name: Pack website
        run: tar -cf www.tar -C www .

      - name: Save website preview
        uses: actions/upload-artifact@v4
        with:
          name: gitpa-website
          path: www.tar

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    concurrency:
      group: production-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gitpa-website
      - name: Unpack website
        run: mkdir www && tar -xf www.tar -C www && rm www.tar
      - name: Check production revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_pages.py prepare
      - name: Publish gh-pages
        if: steps.revision.outputs.current == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: www
          clean: true
          clean-exclude: |
            .nojekyll
      - name: Build Pages and verify the live revision
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_pages.py verify
