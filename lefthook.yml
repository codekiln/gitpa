pre-commit:
  commands:
    identity-guard:
      run: mise run secrets:scan {staged_files}
    # Logseq reads [[Target|Label]] as one page name and makes a stub page for it.
    logseq-wikilink-labels:
      glob: "*.md"
      run: mise run logseq:fix-wikilink-labels {staged_files}
      stage_fixed: true
